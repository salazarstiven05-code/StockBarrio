<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockBarrio | Alertas</title>
  <link rel="stylesheet" href="../Css/Style.css">

<body data-page="alerts">
  <aside class="sidebar">

    <section class="stats" aria-label="Resumen de alertas">

    </section>
    <section class="panel"><div class="panel-heading"><div><p class="eyebrow">Reabastecimiento</p><h2>Productos que requieren atención</h2></div></div><div id="alertsList" class="alerts-list"></div></section>

  <script src="../Js/app.js"></script>
